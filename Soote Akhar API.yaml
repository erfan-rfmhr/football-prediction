components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Match:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tournament:
          allOf:
          - $ref: '#/components/schemas/Tournament'
          readOnly: true
        home_team:
          allOf:
          - $ref: '#/components/schemas/Team'
          readOnly: true
        away_team:
          allOf:
          - $ref: '#/components/schemas/Team'
          readOnly: true
        stage:
          $ref: '#/components/schemas/StageEnum'
        home_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        away_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        start_at:
          type: string
          format: date-time
      required:
      - away_team
      - home_team
      - id
      - stage
      - start_at
      - tournament
    NullEnum:
      enum:
      - null
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    PatchedPrediction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        match:
          $ref: '#/components/schemas/Match'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        home_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        away_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        points:
          nullable: true
          minimum: -9223372036854775808
          maximum: 9223372036854775807
          oneOf:
          - $ref: '#/components/schemas/PointsEnum'
          - $ref: '#/components/schemas/NullEnum'
        user:
          type: integer
    PatchedUser:
      type: object
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
    PointsEnum:
      enum:
      - 10
      - 7
      - 5
      - 2
      type: integer
      description: |-
        * `10` - Exact
        * `7` - Diff
        * `5` - Winner
        * `2` - Wrong
    Prediction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        match:
          $ref: '#/components/schemas/Match'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        home_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        away_score:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        points:
          nullable: true
          minimum: -9223372036854775808
          maximum: 9223372036854775807
          oneOf:
          - $ref: '#/components/schemas/PointsEnum'
          - $ref: '#/components/schemas/NullEnum'
        user:
          type: integer
      required:
      - away_score
      - created_at
      - home_score
      - id
      - match
      - updated_at
      - user
    SendEmailReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    SetPassword:
      type: object
      properties:
        new_password:
          type: string
        current_password:
          type: string
      required:
      - current_password
      - new_password
    SetUsername:
      type: object
      properties:
        current_password:
          type: string
        new_username:
          type: string
          title: Username
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
      required:
      - current_password
      - new_username
    StageEnum:
      enum:
      - مرحله گروهی
      - دور 32ام
      - دور 16ام
      - یک چهارم نهایی
      - نیمه نهایی
      - فینال
      type: string
      description: |-
        * `مرحله گروهی` - Group
        * `دور 32ام` - Round 32
        * `دور 16ام` - Round 16
        * `یک چهارم نهایی` - Quarter Final
        * `نیمه نهایی` - Semi Final
        * `فینال` - Final
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
