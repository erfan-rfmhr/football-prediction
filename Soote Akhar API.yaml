openapi: 3.0.3
info:
  title: Soote Akhar API
  version: 1.0.0
paths:
  /api/competitions/matches/:
    get:
      operationId: api_competitions_matches_list
      parameters:
      - name: o
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
          enum:
          - دور 16ام
          - دور 32ام
          - فینال
          - مرحله گروهی
          - نیمه نهایی
          - یک چهارم نهایی
        description: |-
          * `مرحله گروهی` - Group
          * `دور 32ام` - Round 32
          * `دور 16ام` - Round 16
          * `یک چهارم نهایی` - Quarter Final
          * `نیمه نهایی` - Semi Final
          * `فینال` - Final
      - in: query
        name: start_at
        schema:
          type: string
          format: date-time
          enum:
          - month
          - today
          - week
          - year
          - yesterday
        description: |-
          * `today` - Today
          * `yesterday` - Yesterday
          * `week` - Past 7 days
          * `month` - This month
          * `year` - This year
      - in: query
        name: tournament
        schema:
          type: integer
      tags:
      - Competitions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
          description: ''
  /api/competitions/matches/{id}/:
    get:
      operationId: api_competitions_matches_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this match.
        required: true
      tags:
